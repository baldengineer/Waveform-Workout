CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_DAC=y
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_CRC=y

# USB CDC ACM is the serial transport for the interactive Zephyr shell.
CONFIG_USB_DEVICE_STACK_NEXT=y
# The STM32 driver supports other MCUs with HS; this board is FS only.
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n
CONFIG_USBD_MAX_SPEED_FULL=y
CONFIG_HWINFO=y
# One FS CDC interface needs only small control and 64-byte bulk transfers.
CONFIG_UDC_BUF_POOL_SIZE=512
CONFIG_ISR_STACK_SIZE=1024
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=256
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=128
CONFIG_SHELL_PROMPT_UART="trainer:~$ "
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# Measure VDD through VREFINT before attaching the USB transceiver.
CONFIG_ADC=y
CONFIG_SENSOR=y
